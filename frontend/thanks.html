<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Privacy Demo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thanks-container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thanks-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .thanks-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .thanks-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .thanks-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .thanks-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .thanks-content {
            padding: 40px 30px;
            text-align: center;
        }

        .thanks-message {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .prolific-link-container {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border-left: 5px solid #2196f3;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .prolific-link-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .prolific-link-container h3 {
            color: #1976d2;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .prolific-link-container h3 i {
            font-size: 1.2rem;
        }

        .prolific-link {
            display: inline-block;
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .prolific-link:hover {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        .prolific-link i {
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .thanks-container {
                margin: 10px;
                border-radius: 15px;
            }

            .thanks-header {
                padding: 30px 20px;
            }

            .thanks-title {
                font-size: 2rem;
            }

            .thanks-content {
                padding: 30px 20px;
            }

            .prolific-link-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="thanks-container">
        <div class="thanks-header" id="header-section">
            <div class="thanks-icon" id="header-icon">
                <i class="fas fa-spinner fa-spin" id="loading-icon"></i>
            </div>
            
            <h1 class="thanks-title" id="header-title">Verifying Completion...</h1>
            <p class="thanks-subtitle" id="header-subtitle">Please wait while we check your study status</p>
        </div>
        
        <div class="thanks-content">
            <div class="thanks-message" id="message-section">
                <p>Checking your completion status...</p>
            </div>

            <div class="prolific-link-container" id="prolific-section" style="display: none;">
                <h3><i class="fas fa-external-link-alt"></i> Return to Prolific</h3>
                <a href="#" class="prolific-link" id="prolific-completion-link">
                    <i class="fas fa-check"></i> Return to Prolific
                </a>
            </div>
            
            <div id="partial-completion-section" style="display: none;">
                <div style="background: #fff3cd; border: 2px solid #ffc107; border-radius: 10px; padding: 20px; margin-top: 20px;">
                    <h3 style="color: #856404; margin-bottom: 10px;">
                        <i class="fas fa-exclamation-triangle"></i> Study Incomplete
                    </h3>
                    <p style="color: #666; line-height: 1.6;">
                        <span id="partial-message">You have not completed all required questions.</span>
                    </p>
                    <p style="color: #666; margin-top: 10px;">
                        <strong>Progress:</strong> <span id="progress-info">Loading...</span>
                    </p>
                    <p style="color: #856404; margin-top: 15px; font-weight: 600;">
                        No completion code is available for partial completions.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Function to get session ID from localStorage
        function getSessionId() {
            try {
                const state = localStorage.getItem('privacyDemoState');
                if (state) {
                    const parsed = JSON.parse(state);
                    return parsed.sessionId || null;
                }
            } catch (e) {
                console.error('Error getting session ID:', e);
            }
            return null;
        }
        
        // Function to get Prolific PID from URL or localStorage
        function getProlificPid() {
            // First check URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const pidFromUrl = urlParams.get('PROLIFIC_PID');
            
            if (pidFromUrl) {
                return pidFromUrl;
            }
            
            // Fallback to localStorage
            return localStorage.getItem('prolific_pid') || null;
        }
        
        // Function to verify completion status
        async function verifyCompletion() {
            const sessionId = getSessionId();
            const prolificPid = getProlificPid();
            
            if (!sessionId && !prolificPid) {
                showError('No session or participant ID found. Please ensure you accessed this page through the study.');
                return;
            }
            
            try {
                const response = await fetch('https://privacydemo.onrender.com/api/verify-completion', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        prolificPid: prolificPid
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📥 API Response:', data);
                
                // Update UI based on completion status
                if (data.status === 'COMPLETE') {
                    console.log('✅ Status is COMPLETE, showing complete status...');
                    showCompleteStatus(data);
                } else if (data.status === 'PARTIAL') {
                    console.log('⚠️ Status is PARTIAL, showing partial status...');
                    showPartialStatus(data);
                } else {
                    console.warn('❌ Unknown status:', data.status);
                    showError('Unable to verify completion status.');
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                showError('Unable to connect to the server. Please try refreshing the page.');
            }
        }
        
        // Show complete status with completion code
        function showCompleteStatus(data) {
            // Update header
            document.getElementById('loading-icon').className = 'fas fa-check-circle';
            document.getElementById('header-title').textContent = 'Thank You!';
            document.getElementById('header-subtitle').textContent = 'Study Participation Complete. You will be redirected to Prolific soon. If you are not redirected automatically, please click the button below.';
            
            // Update message
            document.getElementById('message-section').innerHTML = `
                <p>${data.message || 'Thank you for completing our privacy demonstration study.'}</p>
                <p style="margin-top: 10px; color: #28a745; font-weight: 600;">
                    <i class="fas fa-check"></i> All ${data.totalQuestions} questions completed successfully!
                </p>
            `;
            
            // Show Prolific link with completion code
            if (data.completionCode && data.redirectUrl) {
                console.log('✅ Completion verified - redirecting to:', data.redirectUrl);
                document.getElementById('prolific-completion-link').href = data.redirectUrl;
                document.getElementById('prolific-section').style.display = 'block';
                
                // Auto-redirect to completion link after a short delay
                setTimeout(() => {
                    console.log('🔄 Auto-redirecting to Prolific completion link...');
                    window.location.replace(data.redirectUrl);
                }, 2000);
            } else {
                console.warn('⚠️ Missing completion code or redirect URL:', {
                    completionCode: data.completionCode,
                    redirectUrl: data.redirectUrl
                });
            }
        }
        
        // Show partial completion status (no completion code)
        function showPartialStatus(data) {
            // Update header
            document.getElementById('loading-icon').className = 'fas fa-exclamation-triangle';
            document.getElementById('header-title').textContent = 'Study Incomplete';
            document.getElementById('header-subtitle').textContent = 'Partial Completion Detected';
            document.getElementById('header-section').style.background = 'linear-gradient(135deg, #ffc107 0%, #ff9800 100%)';
            
            // Update message
            document.getElementById('message-section').innerHTML = `
                <p>Thank you for your participation. However, the study is not yet complete.</p>
            `;
            
            // Show partial completion details
            document.getElementById('partial-message').textContent = data.message || 'You have not completed all required questions.';
            
            let progressText = `${data.completedQuestions || 0} of ${data.totalQuestions || 7} questions answered`;
            
            // Add detailed status information
            if (data.missingSteps && data.missingSteps.length > 0) {
                progressText += `\n\nMissing components:\n• ${data.missingSteps.join('\n• ')}`;
            } else {
                progressText += ` (${Math.round(data.completedPercentage || 0)}% complete)`;
            }
            
            document.getElementById('progress-info').innerHTML = progressText.replace(/\n/g, '<br>');
            document.getElementById('partial-completion-section').style.display = 'block';
            
            // Hide Prolific link - no completion code for partial completions
            document.getElementById('prolific-section').style.display = 'none';
        }
        
        // Show error message
        function showError(message) {
            document.getElementById('loading-icon').className = 'fas fa-times-circle';
            document.getElementById('header-title').textContent = 'Error';
            document.getElementById('header-subtitle').textContent = 'Unable to verify completion';
            document.getElementById('header-section').style.background = 'linear-gradient(135deg, #dc3545 0%, #c82333 100%)';
            
            document.getElementById('message-section').innerHTML = `
                <p style="color: #dc3545;">${message}</p>
                <p style="margin-top: 10px;">Please contact the study administrator if this issue persists.</p>
            `;
        }
        
        // Verify completion on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Add a small delay to ensure smooth animation
            setTimeout(verifyCompletion, 1000);
        });
    </script>
</body>
</html>
